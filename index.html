                items: [
                    { time: "07:30 - 09:30", activity: "ตลาดเช้าคิซุ (Osaka Kizu Market)", location: "Osaka Kizu Wholesale Market", details: "เดินลงทิศใต้ผ่านย่านอเมริกาโมะรุ ทานข้าวหน้าปลาดิบสดๆ และซื้อผลไม้ราคาถูกที่ซูเปอร์ ODA" },
                    { time: "09:30 - 12:00", activity: "ชมหอคอยสึเต็งกากุ & ย่านชินเซไก", location: "Tsutenkaku Tower", details: "เดินมุ่งหน้าทิศตะวันออก ถ่ายรูปหอคอยสึเต็งกากุ ชิมคุชิคาซึ (ของทอดเสียบไม้) ย่านเรโทร" },
                    { time: "12:00 - 14:30", activity: "ช้อปปิ้งอนิเมะ ฟิกเกอร์ Ota Road", location: "Nipponbashi Ota Road", details: "เดินขึ้นทิศเหนือเข้าย่านเดนเดนทาวน์ เลือกซื้อโมเดล เกม การ์ด ที่ถนน Ota Road" },
                    { time: "14:30 - 16:30", activity: "ศาลเจ้าหัวสิงโตยักษ์ นัมบะ ยาซากะ", location: "Namba Yasaka Shrine", details: "เดินเข้าซอยทิศตะวันตกผ่านห้าง Namba Parks ไหว้ขอพรเรื่องโชคลาภและการงานหน้าอาคารหัวสิงโต" },
                    { time: "16:30 เป็นต้นไป", activity: "สตรีทฟู้ด & ช้อปปิ้งย่านโดทงโบริ", location: "Dotonbori Street", details: "เดินเล่นช้อปปิ้งเก็บตกย่านใจกลางเมืองนัมบะ ชินไซบาชิ ทานมื้อค่ำ" }
                ]
            },
            {
                day: 5,
                date: "13.11.26",
                title: "วันที่ 5: ตลาดคุโรมง เช็กอินโรงแรมสนามบิน & Rinku Outlets",
                mapSearch: "Rinku Premium Outlets",
                weather: {
                    icon: "🌊",
                    temp: "11°C - 19°C",
                    desc: "ลมทะเลพัดเย็นสบาย / ริมอ่าวสนามบิน",
                    outfit: "🧥 เสื้อกันลม หรือแจ็กเก็ตอุ่นสำหรับเดินเอาต์เล็ตริมอ่าว"
                },
                items: [
                    { time: "07:00 - 07:30", activity: "Check Out โรงแรม", location: "VIA INN Shinsaibashi", details: "เช็กเอาต์ฝากกระเป๋าเดินทางเพื่อเตรียมตัวมุ่งหน้าสู่โซนสนามบิน" },
                    { time: "07:30 - 10:00", activity: "ตลาดคุโรมง (Kuromon Market)", location: "Kuromon Market Osaka", details: "เดินเข้าถนนคนเดิน Shinsaibashi สู่ตลาดคุโรมง ชิมเนื้อวากิว กุ้งมังกร หอยเชลล์ อูนิ สตรอว์เบอร์รี" },
                    { time: "10:00 - 11:00", activity: "เดินทางไป Rinku-Town", location: "Rinku-Town Station", details: "นั่ง Subway สายสีแดงลง Namba ต่อรถไฟ Nankai ไปลงสถานี Rinku-Town" },
                    { time: "11:00 - 12:00", activity: "Check-in โรงแรมสนามบิน", location: "Odysis Suites Osaka Airport Hotel", details: "เดินตามทางเชื่อมลอยฟ้า (Covered Walkway) จากชั้น 2 ของสถานี Rinku-Town เข้าสู่โรงแรม" },
                    { time: "12:00 เป็นต้นไป", activity: "ช้อปปิ้ง Rinku Premium Outlets", location: "Rinku Premium Outlets", details: "เดินผ่านห้าง Seacle และสะพาน Skywalk ช้อปปิ้งสินค้าแบรนด์เนมส่งท้ายทริปก่อนขึ้นเครื่องกลับ" }
                ]
            }
        ];

        let currentDay = 1;
        let searchQuery = "";

        function updateMapLocation(locSearch) {
            document.getElementById('current-location-text').innerText = locSearch;
            document.getElementById('current-location-text-mob').innerText = locSearch;
            const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(locSearch)}&t=&z=14&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('google-map-frame').src = embedUrl;
            document.getElementById('google-map-frame-mob').src = embedUrl;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';
            TRIP_DATA.forEach(d => {
                const btn = document.createElement('button');
                btn.className = `px-2.5 py-1.5 rounded-md font-medium text-[11px] sm:text-xs transition-all whitespace-nowrap flex items-center gap-1 cursor-pointer shadow-2xs ${
                    d.day === currentDay && !searchQuery
                        ? 'bg-sky-500 text-white font-bold shadow-sky-500/20' 
                        : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200/80'
                }`;
                btn.innerHTML = `<span>วันที่ ${d.day}</span> <span class="text-[10px] opacity-80">(${d.date})</span>`;
                btn.onclick = () => {
                    searchQuery = "";
                    document.getElementById('search-input').value = "";
                    document.getElementById('clear-search-btn').classList.add('hidden');
                    currentDay = d.day;
                    renderDay();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderDay();
        }

        function clearSearch() {
            searchQuery = "";
            document.getElementById('search-input').value = "";
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderDay();
        }

        function renderDay() {
            renderTabs();
            const activeTrip = TRIP_DATA.find(d => d.day === currentDay);
            document.getElementById('day-title').innerText = activeTrip.title;

            // Render Weather
            if (activeTrip.weather) {
                document.getElementById('weather-icon').innerText = activeTrip.weather.icon;
                document.getElementById('weather-temp').innerText = activeTrip.weather.temp;
                document.getElementById('weather-desc').innerText = activeTrip.weather.desc;
                document.getElementById('weather-outfit').innerText = activeTrip.weather.outfit;
            }

            const listContainer = document.getElementById('itinerary-list');
            listContainer.innerHTML = '';

            let itemsToDisplay = [];
            let matchCountText = "";

            if (searchQuery) {
                TRIP_DATA.forEach(d => {
                    d.items.forEach((item, idx) => {
                        if (item.activity.toLowerCase().includes(searchQuery) ||
                            item.location.toLowerCase().includes(searchQuery) ||
                            (item.details && item.details.toLowerCase().includes(searchQuery))) {
                            itemsToDisplay.push({ ...item, dayNum: d.day, itemIndex: idx });
                        }
                    });
                });
                matchCountText = `พบ ${itemsToDisplay.length} รายการ`;
            } else {
                itemsToDisplay = activeTrip.items.map((item, idx) => ({ ...item, dayNum: activeTrip.day, itemIndex: idx }));
            }
            document.getElementById('search-result-count').innerText = matchCountText;

            if (itemsToDisplay.length === 0) {
                listContainer.innerHTML = `<div class="bg-white p-5 text-center rounded-xl border border-slate-200 text-slate-400 text-xs">ไม่พบกิจกรรมที่ค้นหา</div>`;
                return;
            }

            itemsToDisplay.forEach((item) => {
                const targetDayNum = item.dayNum;
                const realIndex = item.itemIndex;

                const card = document.createElement('div');
                card.className = 'bg-white hover:border-sky-300 border border-slate-200/80 p-3 rounded-xl transition-all shadow-2xs space-y-1.5';
                card.innerHTML = `
                    <div class="flex justify-between items-center gap-2">
                        <div class="flex items-center gap-1.5">
                            ${searchQuery ? `<span class="bg-sky-100 text-sky-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">วันที่ ${targetDayNum}</span>` : ''}
                            <span class="text-sky-600 font-semibold text-xs">⏰ ${item.time}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="openEditActivityModal(${targetDayNum}, ${realIndex})" 
                                    class="bg-slate-100 hover:bg-emerald-500 text-slate-600 hover:text-white px-2 py-0.5 rounded text-[11px] font-medium transition-colors border border-slate-200 cursor-pointer" title="แก้ไข">
                                ✏️
                            </button>
                            <button type="button" onclick="deleteActivity(${targetDayNum}, ${realIndex})" 
                                    class="bg-slate-100 hover:bg-rose-500 text-slate-600 hover:text-white px-2 py-0.5 rounded text-[11px] font-medium transition-colors border border-slate-200 cursor-pointer" title="ลบ">
                                🗑️
                            </button>
                            <button type="button" onclick="updateMapLocation('${item.location.replace(/'/g, "\\'")}')" 
                                    class="bg-slate-100 hover:bg-sky-500 text-slate-600 hover:text-white px-2 py-0.5 rounded text-[11px] font-medium transition-colors border border-slate-200 cursor-pointer" title="ดูตำแหน่ง">
                                📍
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-baseline sm:gap-2">
                        <h3 class="text-xs sm:text-sm font-bold text-slate-800">${item.activity}</h3>
                        <p class="text-[11px] font-medium text-emerald-600">📌 ${item.location}</p>
                    </div>
                    ${item.details ? `<p class="text-[11px] text-slate-600 bg-slate-50/80 p-2 rounded-lg border border-slate-100 leading-relaxed">${item.details}</p>` : ''}
                `;
                listContainer.appendChild(card);
            });

            if (!searchQuery && activeTrip.items.length > 0) {
                updateMapLocation(activeTrip.mapSearch || activeTrip.items[0].location);
            }
        }

        // Modal Controls
        function openAddActivityModal() {
            document.getElementById('modal-title').innerText = "เพิ่มกิจกรรมใหม่";
            document.getElementById('edit-item-index').value = "";
            document.getElementById('form-day').value = currentDay;
            document.getElementById('form-time').value = "";
            document.getElementById('form-location').value = "";
            document.getElementById('form-activity').value = "";
            document.getElementById('form-details').value = "";
            document.getElementById('activity-modal').classList.remove('hidden');
        }

        function openEditActivityModal(dayNum, itemIndex) {
            const dayObj = TRIP_DATA.find(d => d.day === dayNum);
            const item = dayObj.items[itemIndex];
            
            document.getElementById('modal-title').innerText = "แก้ไขกิจกรรม";
            document.getElementById('edit-item-index').value = `${dayNum}-${itemIndex}`;
            document.getElementById('form-day').value = dayNum;
            document.getElementById('form-time').value = item.time;
            document.getElementById('form-location').value = item.location;
            document.getElementById('form-activity').value = item.activity;
            document.getElementById('form-details').value = item.details || "";
            document.getElementById('activity-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('activity-modal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const editVal = document.getElementById('edit-item-index').value;
            const targetDay = parseInt(document.getElementById('form-day').value);
            const time = document.getElementById('form-time').value;
            const location = document.getElementById('form-location').value;
            const activity = document.getElementById('form-activity').value;
            const details = document.getElementById('form-details').value;

            const newItem = { time, activity, location, details };

            if (editVal !== "") {
                const [oldDay, oldIndex] = editVal.split('-').map(Number);
                if (oldDay === targetDay) {
                    TRIP_DATA.find(d => d.day === targetDay).items[oldIndex] = newItem;
                } else {
                    TRIP_DATA.find(d => d.day === oldDay).items.splice(oldIndex, 1);
                    TRIP_DATA.find(d => d.day === targetDay).items.push(newItem);
                }
            } else {
                TRIP_DATA.find(d => d.day === targetDay).items.push(newItem);
            }

            searchQuery = "";
            document.getElementById('search-input').value = "";
            document.getElementById('clear-search-btn').classList.add('hidden');
            currentDay = targetDay;

            closeModal();
            renderDay();
        }

        function deleteActivity(dayNum, itemIndex) {
            if (confirm("คุณต้องการลบกิจกรรมนี้ใช่หรือไม่?")) {
                TRIP_DATA.find(d => d.day === dayNum).items.splice(itemIndex, 1);
                renderDay();
            }
        }

        // Initialize App
        renderDay();
    </script>
</body>
</html>
